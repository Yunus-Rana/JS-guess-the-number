<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <h2>Number Guessing Game</h2>
    <p class="subtitle">Guess a number between 1 and 100</p>

    <form id="guessForm">
      <input 
        type="number" 
        id="guessInput" 
        placeholder="Enter your guess" 
        min="1" 
        max="100" 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="submitBtn">Submit Guess</button>
    </form>

    <div class="feedback-area">
      <p id="message"></p>
      <p id="attemptsText">Attempts: <span id="attemptCount">0</span></p>
    </div>

    <button type="button" id="restartBtn" class="hidden">Play Again</button>
  </main>

  <script src="guess.js"></script>
</body>
</html>
